plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'id.kalanusantara'
version = '0.1.0-SNAPSHOT'
description = 'KalaCore - Core plugin for Kala Nusantara RPG server'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
}

dependencies {
    // Paper API — 1.21.4 snapshot (compatible with Paper 26.x API surface)
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    // PlaceholderAPI (soft-depend)
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // Vault API (from server plugin)
    compileOnly files('../../server/plugins/VaultUnlocked-2.20.2.jar')

    // SQLite JDBC (bundled in JAR)
    implementation 'org.xerial:sqlite-jdbc:3.43.0.0'

    // Testing (V7)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.xerial', 'id.kalanusantara.lib.sqlite'
    minimize()
}

build.dependsOn shadowJar
