        - [New] Added the Tommyknockers modular content packages.
        - [New] Plugin updates can be applied without a restart with /bs applypluginupdate or the nightbreak.applyPluginUpdatesWithoutRestart setting.
        - [Fix] Boss signs in modular structures pasted into existing worlds now spawn their bosses.
        - [Fix] Paintings and item frames in pasted modules are kept and turn with rotated modules.
        - [Fix] Sign markers written by plugins or older schematics are read again.
        - [Fix] Reloads and plugin updates no longer leave old copies of the plugin running.
        - [Tweak] Byte-identical duplicate content files no longer produce warnings.
