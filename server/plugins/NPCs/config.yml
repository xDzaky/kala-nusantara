    - "&e/npcs move <id|name> <world> <x> <y> <z> [yaw] [pitch]&7 - Move an NPC exactly."
    - "&e/npcs tp [id|name]&7 - Teleport an NPC to you."
    - "&e/npcs status&7 - Show runtime and storage status."
    - "&e/npcs audit&7 - Show role counts and data health."
    - "&e/npcs tempblocks cleanup [namespace] [key]&7 - Clean protected NPC temporary blocks."
    - "&e/npcs save&7 - Save standalone NPC data immediately."
    - "&e/npcs backup&7 - Export standalone NPC data to backups."
    - "&e/npcs reload&7 - Reload config."
