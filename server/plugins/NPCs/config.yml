# Master switch for the plugin.
enabled: true

npcs:
  # Minecraft profile names are limited; display names can be longer in future versions, but the backing
  # fake player must use a safe profile name.
  max-profile-name-length: 16
  default-name: "NPC_{random}"
  # Prevent normal combat damage to fake-player NPCs. Creative/admin commands can still force deaths,
  # so auto-respawn below keeps NPCs from getting stuck as dead bodies.
  invulnerable: true
  auto-respawn: true
  respawn-delay-ticks: 40
  collidable: false
  cleanup-linked-on-disable: true
  cleanup-standalone-on-disable: true
  # Linked NPCs are created by other plugins such as Bodyguard and are not persisted.
  allow-linked-api: true
  fake-player:
    # Keep off by default so fake-player NPCs do not inflate world/player counts or trigger player-scoped work.
    count-as-world-player: false
    show-in-tab-list: false
    broadcast-join-leave: false

tick:
  # Legacy behaviour interval. Movement uses the lower value between this and behavior.movement-interval-ticks.
  interval-ticks: 20
  save-interval-ticks: 1200

storage:
  # yaml preserves the existing npcs.yml behavior. Use sqlite, mysql, or mariadb for database storage.
  type: yaml
  sqlite-file: npcs.db
  table-prefix: npcs_
  mysql:
    jdbc-url: "jdbc:mysql://localhost:3306/minecraft_plugins?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false"
    username: ""
    password: ""
  mariadb:
    jdbc-url: "jdbc:mariadb://localhost:3306/minecraft_plugins?sslMode=verify-full"
    username: ""
    password: ""

behavior:
  # Fake-player NPCs move in small grounded steps and route through nearby safe standing columns.
  movement-interval-ticks: 2
  movement-step-blocks: 0.45
  pathfinding-radius: 24.0
  pathfinding-max-nodes: 512
  stuck-retarget-ticks: 60
  target-reach-distance: 1.25
  guard-detection-radius: 16.0
  guard-attack-range: 2.8
  guard-attack-damage: 4.0
  guard-attack-cooldown-ticks: 20
  bodyguard-follow-distance: 3.0
  # Bodyguards use this minimum owner-follow step so they can keep up with sprinting players.
  bodyguard-follow-step-blocks: 0.65
  bodyguard-teleport-distance: 32.0
  max-managed-npcs-per-tick: 16
  water-navigation:
    # Short streams, flowing farm channels, and flooded caves are handled as swim steps.
    enabled: true
    swim-step-blocks: 0.45
    # Lets NPCs follow underwater targets vertically instead of staying at the water surface.
    aquatic-follow-enabled: true
    vertical-swim-step-blocks: 0.35
    max-depth-search-blocks: 16
    # Longer water runs are left to the boat crossing assistant below.
    prefer-boat-after-blocks: 8
    max-exit-search-blocks: 4
  traversal-assist:
    enabled: true
    linked-enabled: true
    standalone-enabled: true
    bridge-material: COBBLESTONE
    bridge-width-blocks: 2
    lifetime-seconds: 120
    max-blocks-per-route: 64
    max-placements-per-tick: 2
    fall-solid-first: true
    water-fallback-enabled: true
    # When a grounded route is blocked by a long/deep water crossing, NPCs can spawn a temporary boat,
    # ride across the water, then disembark on the next safe shore.
    boat-crossing-enabled: true
    boat-min-water-blocks: 6
    boat-min-water-depth-blocks: 2
    boat-max-scan-blocks: 64
    boat-speed-blocks: 0.95
    # Bow-equipped linked NPCs can hold a high perch while they have a clear shot, then descend once the target moves too far.
    bow-perch-enabled: true
    bow-perch-min-height-blocks: 3.0
    bow-perch-max-distance-blocks: 24.0
    blocked-worlds:
      - stormcourts_court
      - stormcourts_jail
      - crimereconstruction
      - crime_reconstruction
      - justaprankbro_scenes

traders:
  max-offers: 18

